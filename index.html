<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#031f49">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paizão">
  <meta name="robots" content="noindex,nofollow">
  <title>Controle da Borracharia</title>
  <link rel="stylesheet" href="styles.css?v=3.12.7.8.3">

  <style>
    /* V3.12.7.15 — Login visual + PWA */
    #loginView.login-view {
      min-height:100vh; padding:24px 16px; box-sizing:border-box;
      background:
        linear-gradient(rgba(255,255,255,.48),rgba(255,255,255,.62)),
        url('login-background.webp') center/cover no-repeat fixed;
    }
    #loginView .login-card {
      max-width:440px; margin:0 auto; padding:26px 22px; border-radius:28px;
      background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.72);
      box-shadow:0 18px 55px rgba(0,25,65,.28); backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    #loginView .brand-area:before {
      content:''; display:block; width:min(290px,82%); aspect-ratio:1.45; margin:0 auto 8px;
      background:url('logo-paizao.webp') center/contain no-repeat; border-radius:18px;
    }
    #loginView #loginLogo, #loginView #loginLogoFallback {display:none !important;}
    #loginView #loginBusinessName {color:#06366f; margin-top:4px;}
    #loginView #tenantInfo {color:#46566b;}
    #loginView input {background:rgba(255,255,255,.94);}
    @media(max-width:480px){#loginView.login-view{padding:14px 12px;background-attachment:scroll}#loginView .login-card{padding:20px 16px;border-radius:22px}}

    /* Melhor contraste nos elementos com fundo azul */
    button.btn-primary,
    .btn.btn-primary,
    .sidebar .nav-btn.active,
    button.nav-btn.active {
      color: #ffd700 !important;
    }
    button.btn-primary:hover,
    .btn.btn-primary:hover,
    .sidebar .nav-btn.active:hover,
    button.nav-btn.active:hover {
      color: #ffea70 !important;
    }
  </style>
</head>
<body>
  <div id="appSplash" class="app-splash" aria-hidden="true"></div>
  <style>
    html, body { background:#031f49; }
    .app-splash{position:fixed;inset:0;z-index:999999;background:#031f49 url('splash-paizao.png') center/cover no-repeat;opacity:1;visibility:visible;transition:opacity .32s ease,visibility .32s ease}
    .app-splash.hide{opacity:0;visibility:hidden;pointer-events:none}
  </style>
  <script>
    (function(){
      var started=Date.now();
      function closeSplash(){
        var wait=Math.max(0,1500-(Date.now()-started));
        setTimeout(function(){var el=document.getElementById('appSplash');if(el)el.classList.add('hide');},wait);
      }
      if(document.readyState==='complete') closeSplash(); else window.addEventListener('load',closeSplash,{once:true});
      setTimeout(closeSplash,3200);
    })();
  </script>
  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading-overlay"><div class="loading-card">Conectando ao sistema...</div></div>

  <section id="configView" class="view login-view hidden">
    <div class="login-card"><div class="brand-area"><div class="brand-fallback">!</div><h1>Firebase não configurado</h1><p>Preencha o arquivo firebase-config.js.</p></div></div>
  </section>

  <section id="loginView" class="view login-view hidden">
    <div class="login-card">
      <div class="brand-area">
        <img id="loginLogo" class="brand-logo hidden" alt="Logomarca">
        <div id="loginLogoFallback" class="brand-fallback">B</div>
        <h1 id="loginBusinessName">Controle da Borracharia</h1>
        <p id="tenantInfo">Acesso online por link.</p>
      </div>
      <form id="loginForm" class="form-stack">
        <label>Usuário<input id="loginUser" autocomplete="username" required placeholder="Digite seu usuário"></label>
        <label>Senha<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Digite sua senha"></label>
        <button class="btn btn-primary">Entrar</button>
      </form>
      <button id="showSetupBtn" class="btn btn-secondary full-button">Configurar primeira conta</button>
      <p class="muted small">Use o link com <strong>?loja=nome-da-borracharia</strong>.</p>
    </div>
  </section>

  <section id="setupView" class="view login-view hidden">
    <div class="login-card">
      <div class="brand-area"><div class="brand-fallback">1</div><h1>Primeira configuração</h1><p>Crie a borracharia e o administrador principal.</p></div>
      <form id="setupForm" class="form-stack">
        <label>Nome da borracharia<input name="businessName" required></label>
        <label>Nome do administrador<input name="name" required></label>
        <label>Usuário do administrador<input name="username" required minlength="3"></label>
        <label>Senha<input name="password" type="password" required minlength="6"></label>
        <button class="btn btn-primary">Criar sistema online</button>
        <button id="backLoginBtn" type="button" class="btn btn-secondary">Voltar</button>
      </form>
    </div>
  </section>

  <section id="appView" class="view hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <img id="headerLogo" class="header-logo hidden" alt="Logomarca">
        <div id="headerLogoFallback" class="header-fallback">B</div>
        <div><h2 id="headerBusinessName">Borracharia</h2><span id="roleBadge" class="badge"></span></div>
      </div>
      <button id="logoutBtn" class="btn btn-ghost">Sair</button>
    </header>
    <div class="app-shell">
      <nav id="sidebar" class="sidebar"></nav>
      <main class="content">
        <section id="dashboardPage" class="page"></section>
        <section id="ordersPage" class="page hidden"></section>
        <section id="historyPage" class="page hidden"></section>
        <section id="newOrderPage" class="page hidden"></section>
        <section id="quickOrderPage" class="page hidden"></section>
        <section id="stockPage" class="page hidden"></section>
        <section id="servicesPage" class="page hidden"></section>
        <section id="movementsPage" class="page hidden"></section>
        <section id="cashPage" class="page hidden"></section>
        <section id="receivablesPage" class="page hidden"></section>
        <section id="reportsPage" class="page hidden"></section>
        <section id="rafflePage" class="page hidden"></section>
        <section id="publicityPage" class="page hidden"></section>
        <section id="marketplacePage" class="page hidden"></section>
        <section id="suppliersPage" class="page hidden"></section>
        <section id="usersPage" class="page hidden"></section>
        <section id="profilePage" class="page hidden"></section>
        <section id="settingsPage" class="page hidden"></section>
      </main>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div>
  <script src="firebase-config.js?v=3.12.7.8.3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="app.js?v=3.12.7.16"></script>
<script src="pwa-install.js?v=3.12.7.16" defer></script>
</body>
</html>
