<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel Master • Gestão de Borracharias</title><link rel="stylesheet" href="master.css"></head><body><header><div><strong>🛞 Gestão de Borracharias</strong><small>PAINEL MASTER</small></div><button id="logout" hidden>Sair</button></header><main><section id="login" class="card"><h1>Acesso do proprietário</h1><p>Entre com o e-mail e senha do usuário Master cadastrado no Firebase Authentication.</p><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="panel" hidden><div class="top"><h1>Minhas borracharias</h1><button id="newBtn">+ Nova borracharia</button></div><div id="stats" class="stats"></div><div id="list" class="cards"></div><section class="card" id="editor" hidden><h2 id="editorTitle">Cadastrar borracharia</h2><form id="tenantForm"><label>Identificador da loja (não pode ser alterado)<input id="slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="borracharia-silva" required></label><label>Nome da borracharia<input id="name" required maxlength="100"></label><label>Responsável<input id="owner" maxlength="100"></label><label>Telefone<input id="phone" maxlength="30"></label><label>Cidade<input id="city" maxlength="100"></label><label>Plano<select id="plan"><option value="essencial">Essencial</option><option value="profissional">Profissional</option><option value="completo">Completo</option></select></label><label>Situação<select id="status"><option value="teste">Teste</option><option value="ativa">Ativa</option><option value="suspensa">Suspensa</option></select></label><label>Vencimento<input id="due" type="date"></label><label>Limite de funcionários<input id="users" type="number" min="1" max="999" value="2" required></label><fieldset><legend>Módulos contratados</legend><div id="modules"></div></fieldset><div class="actions"><button type="submit">Salvar</button><button id="cancel" type="button" class="secondary">Cancelar</button></div></form></section></section><p id="message" role="status"></p></main><script src="firebase-config.js"></script><script type="module" src="master.js"></script></body></html>
